<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#000000">
<title>TT Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500&family=Martian+Mono:wdth,wght@75..112.5,400..500&display=swap" rel="stylesheet">
<style>
  /* Monochrome system, matched to peyakhoeun.com:
     black ground, white ink, line weight is the only "color". */
  :root{
    --bg:#000;
    --ink:#f4f4f4;
    --ink-2:#b4b4b4;
    --ink-3:#8c8c8c;
    --rule:#262626;
    --rule-strong:#4a4a4a;
    --mono:'Martian Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
    --sans:'Atkinson Hyperlegible Next', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --ease-out:cubic-bezier(0.16, 1, 0.3, 1);
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  html{background:var(--bg);}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding:28px 16px 60px;
  }
  ::selection{background:var(--ink); color:var(--bg);}
  :focus-visible{outline:1px dashed var(--ink); outline-offset:4px;}
  .wrap{max-width:840px; margin:0 auto;}

  .mono, h1, .score, .score-btn, .switch-label, .deuce-badge, .lb-title, .lb-sub,
  .lb-col-headers, .lb-rank, .lb-stat, .win-title, .win-name, .win-score, .mode-btn,
  .reset-btn, .add-btn, .name-select, .subtitle{
    font-family:var(--mono);
    font-stretch:87.5%;
  }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:28px;
    padding-bottom:20px;
    border-bottom:1px solid var(--rule);
    flex-wrap:wrap;
  }
  .title-block{display:flex; align-items:center; gap:14px;}
  .ball-logo{width:30px; height:30px; flex-shrink:0;}
  h1{
    font-weight:500;
    font-size:clamp(18px,4.2vw,26px);
    font-stretch:75%;
    letter-spacing:-0.03em;
    margin:0;
    line-height:1;
  }
  .subtitle{color:var(--ink-3); font-size:12px; margin-top:6px;}

  .header-actions{display:flex; gap:10px; flex-wrap:wrap;}

  .reset-btn{
    background:transparent;
    border:1px solid var(--rule-strong);
    color:var(--ink-2);
    font-weight:400;
    font-size:12px;
    padding:10px 14px;
    cursor:pointer;
    transition:color .2s var(--ease-out), border-color .2s var(--ease-out);
  }
  .reset-btn:hover{color:var(--ink); border-color:var(--ink);}
  .reset-btn:active{transform:scale(0.97);}

  /* Mode switch (21 / 11) */
  .mode{
    display:inline-flex;
    border:1px solid var(--rule-strong);
  }
  .mode-btn{
    background:transparent;
    border:none;
    color:var(--ink-3);
    font-size:12px;
    padding:10px 14px;
    cursor:pointer;
    transition:color .2s var(--ease-out), background .2s var(--ease-out);
  }
  .mode-btn + .mode-btn{border-left:1px solid var(--rule-strong);}
  .mode-btn:hover:not(:disabled){color:var(--ink);}
  .mode-btn[aria-pressed="true"]{background:var(--ink); color:var(--bg);}
  .mode-btn:disabled{cursor:not-allowed;}
  .mode-btn:disabled:not([aria-pressed="true"]){opacity:0.4;}

  /* Court */
  .court{
    position:relative;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    gap:14px;
    align-items:stretch;
  }
  @media (max-width:640px){
    .court{grid-template-columns:1fr; }
    .net{ order:2; flex-direction:row; padding:10px 0; }
    .panel.b{order:3;}
    .panel.a{order:1;}
  }

  .panel{
    background:var(--bg);
    border:1px solid var(--rule-strong);
    padding:22px 18px 24px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    position:relative;
    transition:border-color .2s var(--ease-out), box-shadow .2s var(--ease-out);
  }
  .panel.serving{
    border-color:var(--ink);
    box-shadow:inset 0 0 0 1px var(--ink);
  }

  .name-row{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    justify-content:center;
  }
  select.name-select{
    appearance:none;
    background:var(--bg);
    border:1px solid var(--rule-strong);
    color:var(--ink);
    font-weight:500;
    font-size:14px;
    padding:8px 32px 8px 12px;
    cursor:pointer;
    max-width:180px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='none' stroke='%23b4b4b4' stroke-width='1.5'><path d='M5 7l5 5 5-5'/></svg>");
    background-repeat:no-repeat;
    background-position:right 10px center;
    background-size:14px;
  }
  select.name-select:hover{border-color:var(--ink-2);}
  select.name-select:focus-visible{outline:1px dashed var(--ink); outline-offset:3px;}

  .serve-ball{
    width:12px; height:12px;
    border-radius:50%;
    border:1px solid var(--rule-strong);
    background:transparent;
    transition:background .2s var(--ease-out), border-color .2s var(--ease-out);
    flex-shrink:0;
  }
  .panel.serving .serve-ball{
    background:var(--ink);
    border-color:var(--ink);
    animation:bounce 1.1s ease-in-out infinite;
  }
  @keyframes bounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-5px);}
  }
  @media (prefers-reduced-motion: reduce){
    .panel.serving .serve-ball{animation:none;}
  }

  .score{
    font-weight:500;
    font-stretch:75%;
    font-size:clamp(60px,15vw,96px);
    line-height:1;
    letter-spacing:-0.04em;
    font-variant-numeric:tabular-nums;
    color:var(--ink);
  }

  .score-controls{display:flex; gap:10px;}
  .score-btn{
    width:52px; height:52px;
    border:1px solid var(--rule-strong);
    background:transparent;
    color:var(--ink);
    font-size:22px;
    font-weight:400;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:transform .1s ease, background .15s ease, color .15s ease, border-color .15s ease;
  }
  .score-btn.minus{color:var(--ink-2);}
  .score-btn.plus{border-width:2px; border-color:var(--ink);}
  .score-btn:hover{background:var(--ink); color:var(--bg); border-color:var(--ink);}
  .score-btn:active{transform:scale(0.92);}
  .score-btn:disabled{opacity:0.3; cursor:not-allowed; transform:none; background:transparent; color:var(--ink-3);}

  /* Net divider */
  .net{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:0 4px;
  }
  .net-line{
    width:1px;
    flex:1;
    background:repeating-linear-gradient(to bottom, var(--rule-strong) 0 6px, transparent 6px 12px);
    min-height:40px;
  }
  @media (max-width:640px){
    .net-line{width:auto; height:1px; flex:1; background:repeating-linear-gradient(to right, var(--rule-strong) 0 6px, transparent 6px 12px); min-width:40px; min-height:0;}
  }
  .switch-btn{
    background:var(--bg);
    border:1px solid var(--rule-strong);
    color:var(--ink);
    width:46px; height:46px;
    border-radius:50%;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .switch-btn:hover{background:var(--ink); color:var(--bg); border-color:var(--ink);}
  .switch-btn:active svg{transform:rotate(180deg);}
  .switch-btn:disabled{opacity:0.3; cursor:not-allowed; background:var(--bg); color:var(--ink);}
  .switch-btn svg{transition:transform .3s ease; width:18px; height:18px;}
  .switch-label{font-size:10px; color:var(--ink-3); text-align:center; max-width:70px; line-height:1.4;}
  .deuce-badge{
    font-size:10px;
    font-weight:500;
    letter-spacing:0.08em;
    color:var(--bg);
    background:var(--ink);
    padding:4px 8px;
    opacity:0;
    transform:scale(0.9);
    transition:opacity .2s ease, transform .2s ease;
    white-space:nowrap;
  }
  .deuce-badge.show{opacity:1; transform:scale(1);}

  /* Leaderboard */
  .leaderboard{
    margin-top:34px;
    border:1px solid var(--rule-strong);
    padding:20px 20px 8px;
  }
  .lb-header{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:14px;
    gap:12px;
  }
  .lb-title{font-size:14px; font-weight:500; letter-spacing:-0.01em;}
  .lb-sub{font-size:11px; color:var(--ink-3);}
  .lb-col-headers{
    display:grid;
    grid-template-columns:24px 1fr 64px 64px;
    gap:8px;
    padding:0 4px 8px;
    font-size:10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-3);
    border-bottom:1px solid var(--rule);
  }
  .lb-col-headers span:nth-child(3),
  .lb-col-headers span:nth-child(4){text-align:center;}
  .lb-row{
    display:grid;
    grid-template-columns:24px 1fr 64px 64px;
    align-items:center;
    gap:8px;
    padding:11px 4px;
    border-top:1px solid var(--rule);
  }
  .lb-row:first-of-type{border-top:none;}
  .lb-rank{
    font-weight:500;
    font-size:12px;
    color:var(--ink-3);
  }
  .lb-row.top .lb-rank{color:var(--ink);}
  .lb-row.top .lb-name{text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:0.35em;}
  .lb-name{font-weight:500; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .lb-stat{
    font-weight:500;
    font-size:15px;
    text-align:center;
    color:var(--ink);
    border:1px solid var(--rule-strong);
    padding:4px 0;
    font-variant-numeric:tabular-nums;
  }
  .lb-stat.dim{color:var(--ink-3); font-weight:400; border-color:transparent;}

  .add-player{
    display:flex;
    gap:8px;
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid var(--rule);
  }
  .add-input{
    flex:1;
    min-width:0;
    background:var(--bg);
    border:1px solid var(--rule-strong);
    color:var(--ink);
    font-family:var(--sans);
    font-size:15px;
    padding:9px 12px;
    caret-color:var(--ink);
  }
  .add-input::placeholder{color:var(--ink-3);}
  .add-input:hover{border-color:var(--ink-2);}
  .add-input:focus{outline:none; border-color:var(--ink);}
  .add-btn{
    background:var(--ink);
    color:var(--bg);
    border:1px solid var(--ink);
    font-size:12px;
    font-weight:500;
    padding:9px 14px;
    cursor:pointer;
    white-space:nowrap;
  }
  .add-btn:hover{background:var(--bg); color:var(--ink);}
  .add-error{font-family:var(--mono); font-size:11px; color:var(--ink-2); min-height:16px; margin-top:6px;}

  .clear-link{
    display:block;
    margin:10px auto 4px;
    background:none;
    border:none;
    color:var(--ink-3);
    font-family:var(--mono);
    font-size:11px;
    text-decoration:underline;
    text-underline-offset:0.25em;
    cursor:pointer;
    padding:6px;
  }
  .clear-link:hover{color:var(--ink);}

  /* Winner overlay */
  .overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.85);
    backdrop-filter:blur(3px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:20px;
  }
  .overlay.show{display:flex;}
  .win-card{
    background:var(--bg);
    border:2px solid var(--ink);
    padding:36px 32px;
    text-align:center;
    max-width:340px;
    width:100%;
  }
  .win-ball{width:40px; height:40px; margin:0 auto 16px;}
  .win-title{font-size:11px; color:var(--ink-3); letter-spacing:0.08em; text-transform:uppercase; margin-bottom:8px;}
  .win-name{font-size:28px; font-weight:500; font-stretch:75%; letter-spacing:-0.03em; color:var(--ink); margin-bottom:6px; overflow-wrap:anywhere;}
  .win-score{color:var(--ink-2); font-size:14px; margin-bottom:24px;}
  .new-game-btn{
    background:var(--ink);
    color:var(--bg);
    border:1px solid var(--ink);
    font-family:var(--mono);
    font-weight:500;
    font-size:13px;
    padding:13px 22px;
    cursor:pointer;
    width:100%;
    transition:background .15s ease, color .15s ease;
  }
  .new-game-btn:hover{background:var(--bg); color:var(--ink);}
  .new-game-btn:active{transform:scale(0.98);}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="title-block">
      <svg class="ball-logo" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <circle cx="20" cy="20" r="15" stroke="#f4f4f4" stroke-width="2"/>
        <path d="M8 14c6 3 18 3 24 0" stroke="#f4f4f4" stroke-width="1"/>
      </svg>
      <div>
        <h1>TABLE TENNIS TRACKER</h1>
        <div class="subtitle" id="subtitle"></div>
      </div>
    </div>
    <div class="header-actions">
      <div class="mode" role="group" aria-label="Game length">
        <button class="mode-btn" id="mode21" data-mode="21">to 21</button>
        <button class="mode-btn" id="mode11" data-mode="11">to 11</button>
      </div>
      <button class="reset-btn" id="resetBtn">↺ Reset score</button>
    </div>
  </header>

  <div class="court">
    <div class="panel a" id="panelA">
      <div class="name-row">
        <span class="serve-ball" id="ballA"></span>
        <select class="name-select" id="selectA" aria-label="Player one"></select>
      </div>
      <div class="score" id="scoreA">0</div>
      <div class="score-controls">
        <button class="score-btn minus" id="minusA" aria-label="Remove point">−</button>
        <button class="score-btn plus" id="plusA" aria-label="Add point">+</button>
      </div>
    </div>

    <div class="net">
      <div class="net-line"></div>
      <div class="deuce-badge" id="deuceBadge">DEUCE</div>
      <button class="switch-btn" id="switchBtn" title="Manually swap who's serving">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter">
          <path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
          <path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
        </svg>
      </button>
      <div class="switch-label">Switch serve</div>
      <div class="net-line"></div>
    </div>

    <div class="panel b" id="panelB">
      <div class="name-row">
        <select class="name-select" id="selectB" aria-label="Player two"></select>
        <span class="serve-ball" id="ballB"></span>
      </div>
      <div class="score" id="scoreB">0</div>
      <div class="score-controls">
        <button class="score-btn minus" id="minusB" aria-label="Remove point">−</button>
        <button class="score-btn plus" id="plusB" aria-label="Add point">+</button>
      </div>
    </div>
  </div>

  <div class="leaderboard">
    <div class="lb-header">
      <div class="lb-title">LEADERBOARD</div>
      <div class="lb-sub">saved on this device</div>
    </div>
    <div class="lb-col-headers">
      <span></span><span>player</span><span>today</span><span>all-time</span>
    </div>
    <div id="lbList"></div>
    <form class="add-player" id="addForm" autocomplete="off">
      <input class="add-input" id="addInput" type="text" maxlength="20" placeholder="New player name" aria-label="New player name">
      <button class="add-btn" type="submit">+ Add player</button>
    </form>
    <div class="add-error" id="addError" role="status"></div>
    <button class="clear-link" id="clearStatsBtn">Clear all-time stats</button>
  </div>

</div>

<div class="overlay" id="overlay">
  <div class="win-card">
    <svg class="win-ball" viewBox="0 0 40 40" fill="none" aria-hidden="true">
      <circle cx="20" cy="20" r="15" fill="#f4f4f4"/>
    </svg>
    <div class="win-title">Game point</div>
    <div class="win-name" id="winName">Gio wins</div>
    <div class="win-score" id="winScore">21 – 14</div>
    <button class="new-game-btn" id="newGameBtn">Start new game</button>
  </div>
</div>

<script>
  const DEFAULT_PLAYERS = ["Gio","Dylan","Diego","Peya","Guest"];
  // first-to score -> serves per player before swapping
  const MODES = { 21: 5, 11: 2 };
  const STORAGE_KEY = "tt_tracker_v1";

  function todayStr(){
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  }

  function loadStats(){
    let saved = null;
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) saved = JSON.parse(raw);
    }catch(e){ saved = null; }

    if(!saved || typeof saved !== "object"){
      saved = { date: todayStr() };
    }

    // player list: defaults plus anyone added on this device
    const players = Array.isArray(saved.players) ? saved.players.filter(p => typeof p === "string" && p.trim()) : [];
    DEFAULT_PLAYERS.forEach(p => { if(!players.includes(p)) players.push(p); });
    saved.players = players;

    const blankCounts = () => Object.fromEntries(saved.players.map(p => [p, 0]));
    // fill in any players missing from an older save
    saved.today = { ...blankCounts(), ...(saved.today || {}) };
    saved.allTime = { ...blankCounts(), ...(saved.allTime || {}) };

    if(!MODES[saved.mode]) saved.mode = 21;

    // new calendar day -> roll "today" over, keep all-time
    if(saved.date !== todayStr()){
      saved.date = todayStr();
      saved.today = blankCounts();
    }
    return saved;
  }

  function saveStats(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        date: state.date,
        today: state.today,
        allTime: state.allTime,
        players: state.players,
        mode: state.mode
      }));
    }catch(e){ /* storage unavailable, fail silently */ }
  }

  const stats = loadStats();

  let state = {
    players: stats.players,
    mode: stats.mode,  // 21 or 11
    nameA: "Gio",
    nameB: "Dylan",
    scoreA: 0,
    scoreB: 0,
    toggle: 0,       // manual serve-switch parity
    winner: null,    // "A" | "B" | null
    date: stats.date,
    today: stats.today,
    allTime: stats.allTime
  };

  const $ = id => document.getElementById(id);

  function winScore(){ return Number(state.mode); }
  function serveBlock(){ return MODES[state.mode]; }

  function serverSide(){
    const total = state.scoreA + state.scoreB;
    const block = Math.floor(total / serveBlock());
    return ((block + state.toggle) % 2 === 0) ? "A" : "B";
  }

  function buildSelects(){
    [["selectA","nameA"],["selectB","nameB"]].forEach(([selId,key])=>{
      const sel = $(selId);
      sel.innerHTML = "";
      state.players.forEach(p=>{
        const opt = document.createElement("option");
        opt.value = p; opt.textContent = p;
        sel.appendChild(opt);
      });
      sel.value = state[key];
    });
  }

  function render(){
    $("scoreA").textContent = state.scoreA;
    $("scoreB").textContent = state.scoreB;
    $("selectA").value = state.nameA;
    $("selectB").value = state.nameB;

    $("subtitle").textContent = `First to ${winScore()}, win by 2 · serve swaps every ${serveBlock()} points`;

    // game length can only change before the first point
    const inProgress = state.scoreA + state.scoreB > 0 && !state.winner;
    document.querySelectorAll(".mode-btn").forEach(btn=>{
      btn.setAttribute("aria-pressed", String(Number(btn.dataset.mode) === winScore()));
      btn.disabled = inProgress;
      btn.title = inProgress ? "Reset the score to change game length" : "";
    });

    const server = serverSide();
    $("panelA").classList.toggle("serving", server === "A" && !state.winner);
    $("panelB").classList.toggle("serving", server === "B" && !state.winner);

    const gameOver = !!state.winner;
    ["minusA","plusA","minusB","plusB","switchBtn"].forEach(id=>{
      $(id).disabled = gameOver;
    });

    const isDeuce = !gameOver && state.scoreA >= winScore() - 1 && state.scoreB >= winScore() - 1;
    $("deuceBadge").classList.toggle("show", isDeuce);

    renderLeaderboard();
    renderOverlay();
  }

  function renderLeaderboard(){
    const rows = state.players
      .map(name => ({ name, today: state.today[name] || 0, allTime: state.allTime[name] || 0 }))
      .sort((a,b) => b.today - a.today || b.allTime - a.allTime);

    const list = $("lbList");
    list.innerHTML = "";
    rows.forEach((r,i)=>{
      const row = document.createElement("div");
      row.className = "lb-row" + (i===0 && r.today>0 ? " top" : "");
      [["lb-rank", i+1], ["lb-name", r.name], ["lb-stat", r.today], ["lb-stat dim", r.allTime]].forEach(([cls, text])=>{
        const cell = document.createElement("div");
        cell.className = cls;
        cell.textContent = text;
        row.appendChild(cell);
      });
      list.appendChild(row);
    });
  }

  function clearAllTimeStats(){
    const ok = confirm("Clear all saved stats (today + all-time) on this device? This can't be undone.");
    if(!ok) return;
    state.today = Object.fromEntries(state.players.map(p => [p, 0]));
    state.allTime = Object.fromEntries(state.players.map(p => [p, 0]));
    state.date = todayStr();
    saveStats();
    render();
  }

  function renderOverlay(){
    if(state.winner){
      const name = state.winner === "A" ? state.nameA : state.nameB;
      $("winName").textContent = `${name} wins`;
      $("winScore").textContent = `${state.scoreA} – ${state.scoreB}`;
      $("overlay").classList.add("show");
    } else {
      $("overlay").classList.remove("show");
    }
  }

  function addScore(side, delta){
    if(state.winner) return;
    const key = side === "A" ? "scoreA" : "scoreB";
    state[key] = Math.max(0, state[key] + delta);
    checkWin();
    render();
  }

  function checkWin(){
    const a = state.scoreA, b = state.scoreB;
    const aWins = a >= winScore() && (a - b) >= 2;
    const bWins = b >= winScore() && (b - a) >= 2;
    if(!aWins && !bWins) return;

    // if the day rolled over mid-session, roll "today" counts before recording
    const now = todayStr();
    if(state.date !== now){
      state.date = now;
      state.today = Object.fromEntries(state.players.map(p => [p, 0]));
    }
    const winnerName = aWins ? state.nameA : state.nameB;
    state.winner = aWins ? "A" : "B";
    state.today[winnerName] = (state.today[winnerName] || 0) + 1;
    state.allTime[winnerName] = (state.allTime[winnerName] || 0) + 1;
    saveStats();
  }

  function switchServe(){
    if(state.winner) return;
    state.toggle = 1 - state.toggle;
    render();
  }

  function resetScore(){
    state.scoreA = 0;
    state.scoreB = 0;
    state.toggle = 0;
    state.winner = null;
    render();
  }

  function setMode(mode){
    if(state.scoreA + state.scoreB > 0 && !state.winner) return;
    state.mode = mode;
    saveStats();
    resetScore();
  }

  function changePlayer(side, name){
    if(side === "A") state.nameA = name; else state.nameB = name;
    render();
  }

  function addPlayer(e){
    e.preventDefault();
    const input = $("addInput");
    const name = input.value.trim().replace(/\s+/g, " ");
    if(!name){
      $("addError").textContent = "Enter a name first.";
      return;
    }
    if(state.players.some(p => p.toLowerCase() === name.toLowerCase())){
      $("addError").textContent = `${name} is already on the list.`;
      return;
    }
    state.players.push(name);
    state.today[name] = 0;
    state.allTime[name] = 0;
    saveStats();
    input.value = "";
    $("addError").textContent = `Added ${name}.`;
    buildSelects();
    render();
  }

  // events
  $("plusA").onclick = ()=>addScore("A", 1);
  $("minusA").onclick = ()=>addScore("A", -1);
  $("plusB").onclick = ()=>addScore("B", 1);
  $("minusB").onclick = ()=>addScore("B", -1);
  $("switchBtn").onclick = switchServe;
  $("resetBtn").onclick = resetScore;
  $("newGameBtn").onclick = resetScore;
  $("clearStatsBtn").onclick = clearAllTimeStats;
  $("mode21").onclick = ()=>setMode(21);
  $("mode11").onclick = ()=>setMode(11);
  $("addForm").onsubmit = addPlayer;
  $("addInput").oninput = ()=>{ $("addError").textContent = ""; };
  $("selectA").onchange = e => changePlayer("A", e.target.value);
  $("selectB").onchange = e => changePlayer("B", e.target.value);

  buildSelects();
  render();
</script>
</body>
</html>
