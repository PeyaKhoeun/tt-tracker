<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TT Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1B1725;
    --surface:#241D33;
    --surface-2:#2E2542;
    --line: rgba(242,238,247,0.09);
    --ink:#F2EEF7;
    --ink-dim:#A79FBF;
    --red:#e54b4b;
    --green:#39b37b;
    --gold:#e8b23d;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 20% -10%, rgba(229,75,75,0.10), transparent 45%),
      radial-gradient(circle at 100% 10%, rgba(57,179,123,0.08), transparent 40%),
      var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .wrap{max-width:840px; margin:0 auto;}

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:28px;
    flex-wrap:wrap;
  }
  .title-block{display:flex; align-items:center; gap:12px;}
  .ball-logo{width:34px; height:34px; flex-shrink:0;}
  h1{
    font-family:'Archivo Black', sans-serif;
    font-size:clamp(20px,4.5vw,28px);
    letter-spacing:0.5px;
    margin:0;
    line-height:1;
  }
  .subtitle{color:var(--ink-dim); font-size:13px; margin-top:4px;}

  .reset-btn{
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--ink-dim);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    padding:10px 16px;
    border-radius:10px;
    cursor:pointer;
    transition:all .15s ease;
    display:flex; align-items:center; gap:6px;
  }
  .reset-btn:hover{color:var(--ink); border-color:rgba(242,238,247,0.25); background:#352a4a;}
  .reset-btn:active{transform:scale(0.97);}

  /* Court */
  .court{
    position:relative;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    gap:14px;
    align-items:stretch;
  }
  @media (max-width:640px){
    .court{grid-template-columns:1fr; }
    .net{ order:2; flex-direction:row; padding:10px 0; }
    .panel.b{order:3;}
    .panel.a{order:1;}
  }

  .panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:20px;
    padding:22px 18px 24px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    position:relative;
    overflow:hidden;
    transition:box-shadow .2s ease, border-color .2s ease;
  }
  .panel.serving{
    border-color:rgba(229,75,75,0.55);
    box-shadow:0 0 0 1px rgba(229,75,75,0.25), 0 10px 30px -12px rgba(229,75,75,0.35);
  }
  .panel.a{border-top:3px solid var(--red);}
  .panel.b{border-top:3px solid var(--green);}

  .name-row{
    display:flex;
    align-items:center;
    gap:8px;
    width:100%;
    justify-content:center;
  }
  select.name-select{
    appearance:none;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:15px;
    padding:8px 30px 8px 14px;
    border-radius:10px;
    cursor:pointer;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='none' stroke='%23A79FBF' stroke-width='2'><path d='M5 7l5 5 5-5'/></svg>");
    background-repeat:no-repeat;
    background-position:right 10px center;
    background-size:14px;
  }
  select.name-select:focus{outline:2px solid var(--red); outline-offset:1px;}

  .serve-ball{
    width:16px; height:16px;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%, #fff, #d9d4e0 60%, #b8b2c4);
    box-shadow:0 0 0 0 rgba(229,75,75,0);
    opacity:0.15;
    transition:opacity .25s ease, transform .25s ease, box-shadow .25s ease;
    flex-shrink:0;
  }
  .panel.serving .serve-ball{
    opacity:1;
    box-shadow:0 0 12px 2px rgba(229,75,75,0.55);
    animation:bounce 1.1s ease-in-out infinite;
  }
  @keyframes bounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-5px);}
  }
  @media (prefers-reduced-motion: reduce){
    .panel.serving .serve-ball{animation:none;}
  }

  .score{
    font-family:'Archivo Black', sans-serif;
    font-size:clamp(56px,14vw,84px);
    line-height:1;
    letter-spacing:-2px;
    -webkit-font-smoothing:antialiased;
  }
  .panel.a .score{color:var(--red);}
  .panel.b .score{color:var(--green);}

  .score-controls{display:flex; gap:12px;}
  .score-btn{
    width:52px; height:52px;
    border-radius:14px;
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--ink);
    font-family:'Archivo Black', sans-serif;
    font-size:24px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:transform .1s ease, background .15s ease;
  }
  .score-btn:hover{background:#382b4f;}
  .score-btn:active{transform:scale(0.92);}
  .score-btn.minus{color:var(--red);}
  .score-btn.plus{color:var(--green);}
  .score-btn:disabled{opacity:0.35; cursor:not-allowed; transform:none;}

  /* Net divider */
  .net{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:0 4px;
  }
  .net-line{
    width:2px;
    flex:1;
    background:repeating-linear-gradient(to bottom, var(--line) 0 6px, transparent 6px 12px);
    min-height:40px;
  }
  @media (max-width:640px){
    .net-line{width:auto; height:2px; flex:1; background:repeating-linear-gradient(to right, var(--line) 0 6px, transparent 6px 12px); min-width:40px; min-height:0;}
  }
  .switch-btn{
    background:var(--surface-2);
    border:1px solid rgba(229,75,75,0.4);
    color:var(--ink);
    width:46px; height:46px;
    border-radius:50%;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    transition:transform .2s ease, background .15s ease, border-color .15s ease;
  }
  .switch-btn:hover{background:#352a4a; border-color:var(--red);}
  .switch-btn:active svg{transform:rotate(180deg);}
  .switch-btn svg{transition:transform .3s ease; width:20px; height:20px;}
  .switch-label{font-size:11px; color:var(--ink-dim); text-align:center; max-width:70px; line-height:1.3;}

  /* Leaderboard */
  .leaderboard{
    margin-top:34px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:20px;
    padding:20px 20px 8px;
  }
  .lb-header{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:14px;
  }
  .lb-title{font-family:'Archivo Black', sans-serif; font-size:15px; letter-spacing:0.5px;}
  .lb-sub{font-size:11px; color:var(--ink-dim);}
  .lb-col-headers{
    display:grid;
    grid-template-columns:20px 1fr 64px 64px;
    gap:8px;
    padding:0 4px 6px;
    font-size:10px;
    letter-spacing:0.6px;
    text-transform:uppercase;
    color:var(--ink-dim);
    opacity:0.7;
  }
  .lb-col-headers span:nth-child(3),
  .lb-col-headers span:nth-child(4){text-align:center;}
  .lb-row{
    display:grid;
    grid-template-columns:20px 1fr 64px 64px;
    align-items:center;
    gap:8px;
    padding:11px 4px;
    border-top:1px solid var(--line);
  }
  .lb-row:first-of-type{border-top:none;}
  .lb-rank{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:13px;
    color:var(--ink-dim);
  }
  .lb-row.top .lb-rank{color:var(--gold);}
  .lb-name{font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .lb-stat{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:16px;
    text-align:center;
    color:var(--ink);
    background:var(--surface-2);
    border-radius:8px;
    padding:5px 0;
  }
  .lb-stat.dim{color:var(--ink-dim); font-weight:500; background:transparent;}
  .clear-link{
    display:block;
    margin:14px auto 4px;
    background:none;
    border:none;
    color:var(--ink-dim);
    font-family:'Inter',sans-serif;
    font-size:11px;
    text-decoration:underline;
    text-underline-offset:2px;
    cursor:pointer;
    opacity:0.7;
    padding:6px;
  }
  .clear-link:hover{opacity:1; color:var(--red);}

  /* Winner overlay */
  .overlay{
    position:fixed; inset:0;
    background:rgba(15,11,22,0.82);
    backdrop-filter:blur(3px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:20px;
  }
  .overlay.show{display:flex;}
  .win-card{
    background:var(--surface);
    border:1px solid rgba(229,75,75,0.4);
    border-radius:22px;
    padding:36px 32px;
    text-align:center;
    max-width:340px;
    box-shadow:0 20px 60px -20px rgba(229,75,75,0.4);
  }
  .win-ball{width:44px; height:44px; margin:0 auto 14px;}
  .win-title{font-family:'Archivo Black', sans-serif; font-size:15px; color:var(--ink-dim); letter-spacing:1px; text-transform:uppercase; margin-bottom:6px;}
  .win-name{font-family:'Archivo Black', sans-serif; font-size:30px; color:var(--red); margin-bottom:4px;}
  .win-score{font-family:'JetBrains Mono', monospace; color:var(--ink-dim); font-size:15px; margin-bottom:22px;}
  .new-game-btn{
    background:var(--red);
    color:#fff;
    border:none;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:14px;
    padding:13px 22px;
    border-radius:12px;
    cursor:pointer;
    width:100%;
    transition:transform .1s ease, filter .15s ease;
  }
  .new-game-btn:hover{filter:brightness(1.1);}
  .new-game-btn:active{transform:scale(0.98);}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="title-block">
      <svg class="ball-logo" viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="16" fill="url(#g)"/>
        <defs>
          <radialGradient id="g" cx="0.3" cy="0.3" r="0.9">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="55%" stop-color="#e9e4ef"/>
            <stop offset="100%" stop-color="#b8b2c4"/>
          </radialGradient>
        </defs>
      </svg>
      <div>
        <h1>TABLE TENNIS TRACKER</h1>
        <div class="subtitle">First to 21 &middot; serve swaps every 5 points</div>
      </div>
    </div>
    <button class="reset-btn" id="resetBtn">↺ Reset score</button>
  </header>

  <div class="court">
    <div class="panel a" id="panelA">
      <div class="name-row">
        <span class="serve-ball" id="ballA"></span>
        <select class="name-select" id="selectA"></select>
      </div>
      <div class="score" id="scoreA">0</div>
      <div class="score-controls">
        <button class="score-btn minus" id="minusA">−</button>
        <button class="score-btn plus" id="plusA">+</button>
      </div>
    </div>

    <div class="net">
      <div class="net-line"></div>
      <button class="switch-btn" id="switchBtn" title="Manually swap who's serving">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
          <path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
        </svg>
      </button>
      <div class="switch-label">Switch serve</div>
      <div class="net-line"></div>
    </div>

    <div class="panel b" id="panelB">
      <div class="name-row">
        <select class="name-select" id="selectB"></select>
        <span class="serve-ball" id="ballB"></span>
      </div>
      <div class="score" id="scoreB">0</div>
      <div class="score-controls">
        <button class="score-btn minus" id="minusB">−</button>
        <button class="score-btn plus" id="plusB">+</button>
      </div>
    </div>
  </div>

  <div class="leaderboard">
    <div class="lb-header">
      <div class="lb-title">LEADERBOARD</div>
      <div class="lb-sub">saved on this device</div>
    </div>
    <div class="lb-col-headers">
      <span></span><span>player</span><span>today</span><span>all-time</span>
    </div>
    <div id="lbList"></div>
    <button class="clear-link" id="clearStatsBtn">Clear all-time stats</button>
  </div>

</div>

<div class="overlay" id="overlay">
  <div class="win-card">
    <svg class="win-ball" viewBox="0 0 40 40" fill="none">
      <circle cx="20" cy="20" r="16" fill="url(#g2)"/>
      <defs>
        <radialGradient id="g2" cx="0.3" cy="0.3" r="0.9">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="55%" stop-color="#e9e4ef"/>
          <stop offset="100%" stop-color="#b8b2c4"/>
        </radialGradient>
      </defs>
    </svg>
    <div class="win-title">Game point</div>
    <div class="win-name" id="winName">Gio wins</div>
    <div class="win-score" id="winScore">21 – 14</div>
    <button class="new-game-btn" id="newGameBtn">Start new game</button>
  </div>
</div>

<script>
  const PLAYERS = ["Gio","Dylan","Diego","Peya","Guest"];
  const WIN_SCORE = 21;
  const SERVE_BLOCK = 5;
  const STORAGE_KEY = "tt_tracker_v1";

  function todayStr(){
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  }

  function loadStats(){
    let saved = null;
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) saved = JSON.parse(raw);
    }catch(e){ saved = null; }

    const blankCounts = () => Object.fromEntries(PLAYERS.map(p => [p, 0]));

    if(!saved || typeof saved !== "object"){
      saved = { date: todayStr(), today: blankCounts(), allTime: blankCounts() };
    }
    // fill in any players missing from an older save (e.g. list changes later)
    saved.today = { ...blankCounts(), ...(saved.today || {}) };
    saved.allTime = { ...blankCounts(), ...(saved.allTime || {}) };

    // new calendar day -> roll "today" over, keep all-time
    if(saved.date !== todayStr()){
      saved.date = todayStr();
      saved.today = blankCounts();
    }
    return saved;
  }

  function saveStats(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        date: state.date,
        today: state.today,
        allTime: state.allTime
      }));
    }catch(e){ /* storage unavailable, fail silently */ }
  }

  const stats = loadStats();

  let state = {
    nameA: "Gio",
    nameB: "Dylan",
    scoreA: 0,
    scoreB: 0,
    toggle: 0,       // manual serve-switch parity
    winner: null,    // "A" | "B" | null
    date: stats.date,
    today: stats.today,
    allTime: stats.allTime
  };

  const $ = id => document.getElementById(id);

  function serverSide(){
    const total = state.scoreA + state.scoreB;
    const block = Math.floor(total / SERVE_BLOCK);
    return ((block + state.toggle) % 2 === 0) ? "A" : "B";
  }

  function buildSelects(){
    [["selectA","nameA"],["selectB","nameB"]].forEach(([selId,key])=>{
      const sel = $(selId);
      sel.innerHTML = "";
      PLAYERS.forEach(p=>{
        const opt = document.createElement("option");
        opt.value = p; opt.textContent = p;
        sel.appendChild(opt);
      });
      sel.value = state[key];
    });
  }

  function render(){
    $("scoreA").textContent = state.scoreA;
    $("scoreB").textContent = state.scoreB;
    $("selectA").value = state.nameA;
    $("selectB").value = state.nameB;

    const server = serverSide();
    $("panelA").classList.toggle("serving", server === "A" && !state.winner);
    $("panelB").classList.toggle("serving", server === "B" && !state.winner);

    const gameOver = !!state.winner;
    ["minusA","plusA","minusB","plusB","switchBtn"].forEach(id=>{
      $(id).disabled = gameOver;
    });

    renderLeaderboard();
    renderOverlay();
  }

  function renderLeaderboard(){
    const rows = PLAYERS
      .map(name => ({ name, today: state.today[name] || 0, allTime: state.allTime[name] || 0 }))
      .sort((a,b) => b.today - a.today || b.allTime - a.allTime);

    $("lbList").innerHTML = rows.map((r,i)=>`
      <div class="lb-row ${i===0 && r.today>0 ? 'top':''}">
        <div class="lb-rank">${i+1}</div>
        <div class="lb-name">${r.name}</div>
        <div class="lb-stat">${r.today}</div>
        <div class="lb-stat dim">${r.allTime}</div>
      </div>
    `).join("");
  }

  function clearAllTimeStats(){
    const ok = confirm("Clear all saved stats (today + all-time) on this device? This can't be undone.");
    if(!ok) return;
    state.today = Object.fromEntries(PLAYERS.map(p => [p, 0]));
    state.allTime = Object.fromEntries(PLAYERS.map(p => [p, 0]));
    state.date = todayStr();
    saveStats();
    render();
  }

  function renderOverlay(){
    if(state.winner){
      const name = state.winner === "A" ? state.nameA : state.nameB;
      $("winName").textContent = `${name} wins`;
      $("winScore").textContent = `${state.scoreA} – ${state.scoreB}`;
      $("overlay").classList.add("show");
    } else {
      $("overlay").classList.remove("show");
    }
  }

  function addScore(side, delta){
    if(state.winner) return;
    const key = side === "A" ? "scoreA" : "scoreB";
    state[key] = Math.max(0, state[key] + delta);
    checkWin();
    render();
  }

  function checkWin(){
    // if the day rolled over mid-session, roll "today" counts before recording
    const now = todayStr();
    if(state.date !== now){
      state.date = now;
      state.today = Object.fromEntries(PLAYERS.map(p => [p, 0]));
    }
    if(state.scoreA >= WIN_SCORE){
      state.winner = "A";
      state.today[state.nameA]++;
      state.allTime[state.nameA]++;
      saveStats();
    } else if(state.scoreB >= WIN_SCORE){
      state.winner = "B";
      state.today[state.nameB]++;
      state.allTime[state.nameB]++;
      saveStats();
    }
  }

  function switchServe(){
    if(state.winner) return;
    state.toggle = 1 - state.toggle;
    render();
  }

  function resetScore(){
    state.scoreA = 0;
    state.scoreB = 0;
    state.toggle = 0;
    state.winner = null;
    render();
  }

  function changePlayer(side, name){
    if(side === "A") state.nameA = name; else state.nameB = name;
    render();
  }

  // events
  $("plusA").onclick = ()=>addScore("A", 1);
  $("minusA").onclick = ()=>addScore("A", -1);
  $("plusB").onclick = ()=>addScore("B", 1);
  $("minusB").onclick = ()=>addScore("B", -1);
  $("switchBtn").onclick = switchServe;
  $("resetBtn").onclick = resetScore;
  $("newGameBtn").onclick = resetScore;
  $("clearStatsBtn").onclick = clearAllTimeStats;
  $("selectA").onchange = e => changePlayer("A", e.target.value);
  $("selectB").onchange = e => changePlayer("B", e.target.value);

  buildSelects();
  render();
</script>
</body>
</html>
